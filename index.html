<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nintendo Switch Ports</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700;800&family=Dongle:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --muted: #e9e9e9;
    --card: #efefef;
    --text: #111;
    --max-width: 1200px;
    --radius: 40px;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: var(--max-width);
    margin: 40px auto;
    padding: 20px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 48px;
    color: #9a9a9a;
    margin: 0;
  }

  /* ===== Grid ===== */
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: flex-start;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    width: 240px;
    text-align: center;
    box-sizing: border-box;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
  }

  .icon {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 6px;
    margin: 6px auto 14px;
    display: block;
  }

  .title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 6px 0;
  }

  .ver {
    font-weight: 600;
    color: #444;
    margin-top: 6px;
  }

  /* ===== Details Overlay ===== */
  .backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    background: rgba(0, 0, 0, 0);
    -webkit-backdrop-filter: blur(0);
    backdrop-filter: blur(0);
    opacity: 0;
    transition: background 0.35s ease, backdrop-filter 0.35s ease, opacity 0.35s ease;
  }
  .backdrop.show {
    display: flex;
    background: rgba(0, 0, 0, 0.15);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 1;
  }

  .overlay {
    position: relative;
    width: min(1100px, 95%);
    border-radius: 48px;
    background: var(--card);
    padding: 36px;
    box-sizing: border-box;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
    display: grid;
    grid-template-columns: 160px 1fr auto;
    gap: 24px;
    align-items: start;
  }

  .big-icon {
    width: 140px;
    height: 140px;
    border-radius: 8px;
    object-fit: cover;
  }

  .meta-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }

  .meta-line {
    font-weight: 600;
    color: #333;
  }

  .details-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 38px;
    font-weight: 800;
    margin: 0 0 4px 0;
  }

  .details-sub {
    font-weight: 600;
    color: #111;
  }

  .chips {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-end;
  }

  .btn {
    padding: 16px 28px;
    border-radius: 28px;
    background: #cfcfcf;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: background 0.2s ease;
    font-size: 17px;
  }
  .btn:hover {
    background: #bfbfbf;
  }

  .desc {
    grid-column: 1 / span 3;
    font-family: 'Dongle', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
    text-align: center;
    margin-top: 20px;
    color: #222;
  }

  /* Back button now styled like others */
  .nav-back {
    position: absolute;
    left: 24px;
    top: 20px;
    padding: 10px 20px;
    border-radius: 24px;
    background: #cfcfcf;
    border: none;
    font-weight: 700;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }
  .nav-back:hover {
    background: #bfbfbf;
  }

  @media (max-width: 800px) {
    .overlay {
      grid-template-columns: 120px 1fr;
      padding: 24px;
    }
    .chips {
      align-items: center;
    }
    .desc {
      font-size: 22px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Nintendo Switch Ports</h1>
    </header>

    <main>
      <section class="grid" id="grid"></section>
    </main>
  </div>

  <div class="backdrop" id="backdrop">
    <div class="overlay">
      <button class="nav-back" id="closeBtn">← Back</button>

      <div>
        <img src="" alt="" class="big-icon" id="detailIcon">
        <div class="meta-block">
          <div class="meta-line" id="detailAuthor"></div>
          <div class="meta-line" id="detailVersion"></div>
        </div>
      </div>

      <div>
        <h2 class="details-title" id="detailTitle">Title</h2>
        <div class="details-sub" id="detailAuthorName"></div>
      </div>

      <div class="chips">
        <button class="btn" id="downloadBtn">Download</button>
        <button class="btn" id="sourceBtn">Source</button>
      </div>

      <div class="desc" id="detailDesc">Description</div>
    </div>
  </div>

<script>
const grid = document.getElementById('grid');
const backdrop = document.getElementById('backdrop');
const closeBtn = document.getElementById('closeBtn');
const detailIcon = document.getElementById('detailIcon');
const detailTitle = document.getElementById('detailTitle');
const detailAuthor = document.getElementById('detailAuthor');
const detailAuthorName = document.getElementById('detailAuthorName');
const detailVersion = document.getElementById('detailVersion');
const detailDesc = document.getElementById('detailDesc');
const downloadBtn = document.getElementById('downloadBtn');
const sourceBtn = document.getElementById('sourceBtn');

async function fetchJSON(path) {
  try {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (e) {
    console.warn("Failed to fetch", path, e);
    return null;
  }
}

function makeCard(port) {
  const el = document.createElement('button');
  el.className = 'card';
  const img = document.createElement('img');
  img.className = 'icon';
  img.src = port.icon || '';
  el.appendChild(img);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = port.name;
  if (port.color) title.style.color = port.color;
  el.appendChild(title);

  const ver = document.createElement('div');
  ver.className = 'ver';
  ver.textContent = port.version ? 'v' + port.version : '';
  el.appendChild(ver);

  el.addEventListener('click', () => openDetails(port));
  return el;
}

function openDetails(port) {
  detailIcon.src = port.icon || '';
  detailTitle.textContent = port.name || '';
  detailTitle.style.color = port.color || '#000';
  detailAuthor.textContent = port.author || '';
  detailAuthorName.textContent = port.author || '';
  detailVersion.textContent = port.version ? 'v' + port.version : '';
  detailDesc.textContent = port.description || '';

  if (port.download) {
    downloadBtn.onclick = () => window.open(port.download, '_blank');
    downloadBtn.disabled = false;
  } else downloadBtn.disabled = true;

  if (port.source) {
    sourceBtn.onclick = () => window.open(port.source, '_blank');
    sourceBtn.disabled = false;
  } else sourceBtn.disabled = true;

  showBackdrop();
}

function showBackdrop() {
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function hideBackdrop() {
  backdrop.classList.remove('show');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', hideBackdrop);
backdrop.addEventListener('click', e => { if (e.target === backdrop) hideBackdrop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('show')) hideBackdrop(); });

(async function init() {
  const manifest = await fetchJSON('ports.json');
  if (!manifest) {
    grid.innerHTML = '<div style="padding:40px;color:#666">Could not load ports.json</div>';
    return;
  }
  const slugs = Array.isArray(manifest) ? manifest : Object.values(manifest);
  const loaded = [];
  for (const slug of slugs) {
    const data = await fetchJSON('ports/' + slug + '.json');
    if (data) loaded.push(data);
  }
  grid.innerHTML = '';
  loaded.forEach(p => grid.appendChild(makeCard(p)));
})();
</script>
</body>
</html>
