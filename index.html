<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nintendo Switch Ports</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #00DE50;
  --bg: #fff;
  --card: #f4f4f4;
  --text: #111;
  --max-width: 1200px;
  --radius: 38px;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(to bottom, var(--bg) 70%, var(--green) 100%);
  background-attachment: fixed;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== Layout ===== */
.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 60px 40px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 40px;
}

.title-block {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

h1 {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 56px;
  color: #8c8c8c;
  margin: 0 0 8px 0;
}

#portCount {
  font-weight: 600;
  color: #999;
  font-size: 20px;
}

.socials {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: 10px;
}

.socials img {
  width: 34px;
  height: 34px;
  cursor: pointer;
  transition: transform 0.2s ease;
  -webkit-user-drag: none;
}

.socials img:hover {
  transform: scale(1.1);
}

/* ===== Grid ===== */
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 32px;
  justify-content: flex-start;
  opacity: 0;
  transform: translateY(40px);
  animation: slideUp 0.9s cubic-bezier(.25,.8,.25,1) forwards;
}

@keyframes slideUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px;
  width: 240px;
  box-sizing: border-box;
  text-align: center;
  cursor: pointer;
  transition: transform 0.18s ease;
  outline: none;
  border: none;
}

.card:hover {
  transform: scale(1.04);
}

.icon {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
  margin: 0 auto 14px;
  background: #ddd;
  -webkit-mask-image: none;
  mask-image: none;
}

.title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 22px;
  margin: 6px 0;
}

.ver {
  font-weight: 700;
  color: #111;
  margin-top: 6px;
}

/* ===== Responsive ===== */
@media (max-width: 800px) {
  .wrap { padding: 40px 24px; }
  h1 { font-size: 42px; }
  .grid { justify-content: center; }
  .socials img { width: 30px; height: 30px; }
}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Nintendo Switch Ports</h1>
      <div id="portCount">0 Ports Available</div>
    </div>
    <div class="socials">
      <img src="assets/twitter.png" alt="Twitter" id="twitterLink">
      <img src="assets/github.png" alt="GitHub" id="githubLink">
    </div>
  </header>

  <main>
    <section class="grid" id="grid"></section>
  </main>
</div>

<script>
const grid = document.getElementById('grid');
const portCount = document.getElementById('portCount');
const twitterLink = document.getElementById('twitterLink');
const githubLink = document.getElementById('githubLink');

// Social placeholders
twitterLink.onclick = () => window.open('#','_blank');
githubLink.onclick = () => window.open('#','_blank');

async function fetchJSON(path) {
  try {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (err) {
    console.warn("Failed to load", path, err);
    return null;
  }
}

function makeCard(port) {
  const el = document.createElement('button');
  el.className = 'card';
  const img = document.createElement('img');
  img.className = 'icon';
  img.src = port.icon || '';
  img.alt = port.name + ' icon';
  el.appendChild(img);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = port.name;
  if (port.color) title.style.color = port.color;
  el.appendChild(title);

  const ver = document.createElement('div');
  ver.className = 'ver';
  ver.textContent = port.version ? 'v' + port.version : '';
  el.appendChild(ver);

  // open details from previous modal script if still used
  el.onclick = () => openDetails && openDetails(port);
  return el;
}

(async function init() {
  const manifest = await fetchJSON('ports.json');
  if (!manifest) {
    grid.innerHTML = '<div style="padding:40px;color:#666">Could not load ports.json</div>';
    return;
  }

  const slugs = Array.isArray(manifest) ? manifest : Object.values(manifest);
  const loaded = [];
  for (const slug of slugs) {
    const portJson = await fetchJSON('ports/' + slug + '.json');
    if (portJson) loaded.push(portJson);
  }

  grid.innerHTML = '';
  loaded.forEach(p => grid.appendChild(makeCard(p)));
  portCount.textContent = `${loaded.length} Port${loaded.length === 1 ? '' : 's'} Available`;
})();
</script>
</body>
</html>
