<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DS Font Library – Preservia</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1><span class="red3">3</span>DS Font Library</h1>
      <p class="desc">Explore system fonts used across the Nintendo 3DS ecosystem.</p>
    </header>

    <div class="toolbar">
      <div class="searchbar">
        <img src="assets/search.png" alt="Search">
        <input type="text" placeholder="Search..." disabled>
      </div>
      <button class="filter-btn" disabled>
        <img src="assets/filter.png" alt="Filter">
      </button>
    </div>

    <section id="original-fonts">
      <h2>Original Fonts</h2>
      <p class="section-desc">Fonts ported by the Preservia team.</p>
      <div class="font-grid" id="original-grid"></div>
    </section>

    <section id="community-fonts">
      <h2>Community Fonts</h2>
      <p class="section-desc">Fonts ported by the homebrew community.</p>
      <div class="font-grid" id="community-grid"></div>
    </section>

    <footer>
      <img src="assets/logo.png" alt="Preservia Logo" class="preservia-logo">
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
