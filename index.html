<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nintendo Switch Ports</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&family=Dongle:wght@400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff;
  --card:#f1f1f1;
  --text:#111;
  --muted:#e0e0e0;
  --radius:40px;
  --max-width:1200px;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{
  max-width:var(--max-width);
  margin:40px auto;
  padding:20px;
}
header{text-align:center;margin-bottom:36px;}
h1{
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  font-size:48px;
  color:#9a9a9a;
  margin:0;
}
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:32px;
  justify-content:center;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  width:240px;
  padding:22px;
  box-sizing:border-box;
  text-align:center;
  transition:transform .12s ease,box-shadow .12s ease;
  cursor:pointer;
}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 24px rgba(0,0,0,.08);}
.icon{width:110px;height:110px;border-radius:8px;object-fit:cover;margin-bottom:12px;}
.title{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:22px;
  margin:0;
}
.ver{font-weight:600;color:#444;margin-top:4px;}

/* ===== BACKDROP & ANIMATIONS ===== */
.backdrop{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0);
  -webkit-backdrop-filter:blur(0);
  opacity:0;
  z-index:60;
  transition:background .4s ease,backdrop-filter .4s ease,opacity .4s ease;
}
.backdrop.show{
  display:flex;
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:1;
}
.details{
  background:var(--card);
  border-radius:40px;
  padding:32px;
  text-align:center;
  max-width:600px;
  width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  transform:scale(.95);
  opacity:0;
  animation:popIn .35s ease forwards;
}
@keyframes popIn{
  from{transform:scale(.95);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* ===== CONTENT INSIDE MODAL ===== */
.close-btn{
  position:absolute;
  top:24px;
  left:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s ease;
}
.close-btn:hover{background:#cfcfcf;}

.details img{
  width:120px;
  height:120px;
  border-radius:10px;
  object-fit:cover;
  margin-bottom:12px;
}
.details h2{
  font-family:'Montserrat',sans-serif;
  font-size:28px;
  margin:0;
}
.meta{
  margin-top:4px;
  font-size:16px;
  font-weight:600;
  color:#222;
}
.meta span{opacity:.7;}
.buttons{
  margin:20px 0 10px;
  display:flex;
  justify-content:center;
  gap:12px;
}
.btn{
  border:none;
  border-radius:20px;
  padding:10px 26px;
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:18px;
  cursor:pointer;
  transition:transform .1s ease,background .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn.source{background:#d9d9d9;color:#111;}
.btn.download{color:#fff;}
.desc{
  font-family:'Dongle',sans-serif;
  font-size:28px;
  line-height:1.15;
  color:#222;
  max-width:540px;
  margin:10px auto 0;
}

/* responsive */
@media(max-width:600px){
  h1{font-size:40px;}
  .details{padding:24px;}
  .desc{font-size:24px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Nintendo Switch Ports</h1></header>
  <main><section class="grid" id="grid"></section></main>
</div>

<div class="backdrop" id="backdrop">
  <div class="details" id="detailsBox">
    <button class="close-btn" id="closeBtn">✕</button>
    <img id="detailIcon" alt="">
    <h2 id="detailTitle">Title</h2>
    <div class="meta"><span id="detailAuthor"></span> • <span id="detailVersion"></span></div>
    <div class="buttons">
      <button class="btn source" id="sourceBtn">Source</button>
      <button class="btn download" id="downloadBtn">Download</button>
    </div>
    <div class="desc" id="detailDesc"></div>
  </div>
</div>

<script>
const grid=document.getElementById('grid');
const backdrop=document.getElementById('backdrop');
const closeBtn=document.getElementById('closeBtn');
const detailBox=document.getElementById('detailsBox');
const detailIcon=document.getElementById('detailIcon');
const detailTitle=document.getElementById('detailTitle');
const detailAuthor=document.getElementById('detailAuthor');
const detailVersion=document.getElementById('detailVersion');
const detailDesc=document.getElementById('detailDesc');
const downloadBtn=document.getElementById('downloadBtn');
const sourceBtn=document.getElementById('sourceBtn');

async function fetchJSON(path){
  try{
    const res=await fetch(path,{cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(e){console.warn("Fetch fail",path,e);return null;}
}

function makeCard(port){
  const el=document.createElement('button');
  el.className='card';
  const img=document.createElement('img');
  img.className='icon';
  img.src=port.icon||'';
  el.appendChild(img);
  const title=document.createElement('div');
  title.className='title';
  title.textContent=port.name;
  if(port.color) title.style.color=port.color;
  el.appendChild(title);
  const ver=document.createElement('div');
  ver.className='ver';
  ver.textContent=port.version?('v'+port.version):'';
  el.appendChild(ver);
  el.onclick=()=>openDetails(port);
  return el;
}

function openDetails(port){
  detailIcon.src=port.icon||'';
  detailTitle.textContent=port.name||'';
  if(port.color){
    detailTitle.style.color=port.color;
    downloadBtn.style.background=port.color;
  }else{
    detailTitle.style.color='#000';
    downloadBtn.style.background='#555';
  }
  detailAuthor.textContent=port.author||'';
  detailVersion.textContent=port.version?('v'+port.version):'';
  detailDesc.textContent=port.description||'';

  if(port.source){
    sourceBtn.onclick=()=>window.open(port.source,'_blank');
    sourceBtn.disabled=false;
  }else sourceBtn.disabled=true;

  if(port.download){
    downloadBtn.onclick=()=>window.open(port.download,'_blank');
    downloadBtn.disabled=false;
  }else downloadBtn.disabled=true;

  backdrop.classList.add('show');
  document.body.style.overflow='hidden';
}
function hideDetails(){
  backdrop.classList.remove('show');
  document.body.style.overflow='';
}
closeBtn.onclick=hideDetails;
backdrop.onclick=e=>{if(e.target===backdrop)hideDetails();};
document.onkeydown=e=>{if(e.key==='Escape'&&backdrop.classList.contains('show'))hideDetails();};

(async function init(){
  const manifest=await fetchJSON('ports.json');
  if(!manifest){grid.innerHTML='<div style="padding:40px;color:#666">Missing ports.json</div>';return;}
  const slugs=Array.isArray(manifest)?manifest:Object.values(manifest);
  for(const slug of slugs){
    const data=await fetchJSON('ports/'+slug+'.json');
    if(data) grid.appendChild(makeCard(data));
  }
})();
</script>
</body>
</html>
