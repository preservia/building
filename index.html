<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nintendo Switch Ports</title>

<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@700&family=Golos+Text:wght@400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --green: #8ef48e;
  --bg: #fff;
  --card-bg: rgba(255,255,255,0.5);
  --text: #111;
  --radius: 38px;
  --max-width: 1200px;
}
  
.bg {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 10vh;
  width: 100vw;
  height: 110vh;
  z-index: -1;
  background: linear-gradient(to bottom, var(--bg) 65%, var(--green) 115%);
  padding-top: env(safe-area-inset-top);
  overflow-y: visible;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 60px 40px 0;
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 120px);
  box-sizing: border-box;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center; /* Fixed vertical alignment */
  margin-bottom: 40px;
}

.title-block {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

h1 {
  font-family: 'Zalando Sans Expanded', sans-serif;
  font-weight: 700;
  font-size: 50px;
  color: #8c8c8c;
  margin: 0 0 8px 0;
}

#portCount {
  font-weight: 600;
  color: #999;
  font-size: 20px;
}

.socials {
  display: flex;
  align-items: center;
  gap: 24px;
}

.socials img {
  width: 34px;
  height: 34px;
  cursor: pointer;
  transition: transform 0.2s ease;
  -webkit-user-drag: none;
}
.socials img:hover {
  transform: scale(1.1);
}

/* ===== Grid ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 32px;
  justify-content: space-between;
  opacity: 0;
  transform: translateY(40px);
  animation: slideUp 0.9s cubic-bezier(.25,.8,.25,1) forwards;
}

@keyframes slideUp {
  to { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: var(--radius);
  padding: 22px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.18s ease, background 0.3s ease;
  outline: none;
  border: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.card:hover {
  transform: scale(1.05);
}

.icon {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 20px;
  margin: 0 auto 14px;
}

.title {
  font-family: 'Zalando Sans Expanded', sans-serif;
  font-weight: 700;
  font-size: 22px;
  margin: 6px 0;
}

.ver {
  font-weight: 700;
  color: #111;
  margin-top: 6px;
}

/* ===== Details Modal ===== */
.backdrop {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: rgba(0,0,0,0);
  backdrop-filter: blur(0);
  -webkit-backdrop-filter: blur(0);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  transition:
    backdrop-filter 0.35s ease-in-out,
    -webkit-backdrop-filter 0.35s ease-in-out,
    background-color 0.35s ease-in-out,
    opacity 0.35s ease-in-out;
}
.backdrop.show {
  pointer-events: all;
  background-color: rgba(0,0,0,0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 1;
}

.details {
  background: rgba(255,255,255,0.9);
  border-radius: 40px;
  padding: 32px;
  text-align: center;
  max-width: 600px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  transform: scale(.92);
  opacity: 0;
}
.details.show {
  animation: popIn 0.35s ease-in-out forwards;
}
.details.hide {
  animation: popOut 0.35s ease-in-out forwards;
}
@keyframes popIn {
  from { transform: scale(.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes popOut {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(.92); opacity: 0; }
}

.close-btn {
  position: absolute;
  top: 22px; /* Adjusted to be more centered */
  left: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #d9d9d9 !important;
  color: #111 !important;
  -webkit-appearance: none;
  appearance: none;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background .2s ease;
}
.close-btn:hover { background: #cfcfcf; }

.details img {
  width: 120px;
  height: 120px;
  border-radius: 20px;
  object-fit: cover;
  margin-bottom: 12px;
}
.details h2 {
  font-family: 'Zalando Sans Expanded', sans-serif;
  font-weight: 700;
  font-size: 28px;
  margin: 0;
}
.meta {
  margin-top: 4px;
  font-size: 16px;
  font-weight: 600;
  color: #222;
}
.meta span { opacity: .7; }
.buttons {
  margin: 20px 0 10px;
  display: flex;
  justify-content: center;
  gap: 12px;
}
.btn {
  border: none;
  border-radius: 20px;
  padding: 10px 26px;
  font-family: 'Zalando Sans Expanded', sans-serif;
  font-weight: 700;
  font-size: 18px;
  cursor: pointer;
  transition: transform .1s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn.source { background: #d9d9d9; color: #111; }
.btn.download { color: #fff; }
.desc {
  font-family: 'Golos Text', sans-serif;
  font-weight: 400;
  font-size: 18px !important;
  line-height: 1.4;
  color: #222;
  max-width: 540px;
  margin: 10px auto 0;
}

.preservia-logo {
  display: block;
  margin: 80px auto 40px;
  width: clamp(200px, 38vw, 420px);
  opacity: 0.85;
  pointer-events: none;
  animation: fadeInLogo 1s ease 1.2s forwards;
  opacity: 0;
}

@keyframes fadeInLogo {
  to { opacity: 0.85; }
}

@media(max-width:600px){
  .wrap { padding: 40px 24px; }
  h1 { font-size: 42px; }
  .details { padding: 24px; }
  .desc { font-size: 24px; }
}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Nintendo Switch Ports</h1>
      <div id="portCount">0 Ports Available</div>
    </div>
    <div class="socials">
      <img src="assets/twitter.png" alt="Twitter" id="twitterLink">
      <img src="assets/github.png" alt="GitHub" id="githubLink">
    </div>
  </header>

  <main>
    <section class="grid" id="grid"></section>
  </main>
</div>

<!-- Preservia logo -->
<img src="assets/logo.png" alt="Preservia" class="preservia-logo">

<!-- ===== Details Popup ===== -->
<div class="backdrop" id="backdrop">
  <div class="details" id="detailsBox">
    <button class="close-btn" id="closeBtn">✕</button>
    <img id="detailIcon" alt="">
    <h2 id="detailTitle">Title</h2>
    <div class="meta"><span id="detailAuthor"></span> • <span id="detailVersion"></span></div>
    <div class="buttons">
      <button class="btn source" id="sourceBtn">Source</button>
      <button class="btn download" id="downloadBtn">Download</button>
    </div>
    <div class="desc" id="detailDesc"></div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const portCount = document.getElementById('portCount');
const twitterLink = document.getElementById('twitterLink');
const githubLink = document.getElementById('githubLink');

twitterLink.onclick = () => window.open('https://twitter.com/', '_blank');
githubLink.onclick = () => window.open('https://github.com/', '_blank');

// Details
const backdrop = document.getElementById('backdrop');
const detailsBox = document.getElementById('detailsBox');
const closeBtn = document.getElementById('closeBtn');
const detailIcon = document.getElementById('detailIcon');
const detailTitle = document.getElementById('detailTitle');
const detailAuthor = document.getElementById('detailAuthor');
const detailVersion = document.getElementById('detailVersion');
const detailDesc = document.getElementById('detailDesc');
const downloadBtn = document.getElementById('downloadBtn');
const sourceBtn = document.getElementById('sourceBtn');

// ===== Fetching JSON =====
async function fetchJSON(path) {
  try {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (err) {
    console.warn("Failed to load", path, err);
    return null;
  }
}

// ===== Cards =====
function makeCard(port) {
  const el = document.createElement('button');
  el.className = 'card';

  const img = document.createElement('img');
  img.className = 'icon';
  img.src = port.icon || '';
  el.appendChild(img);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = port.name;
  if (port.color) title.style.color = port.color;
  el.appendChild(title);

  const ver = document.createElement('div');
  ver.className = 'ver';
  ver.textContent = port.version ? 'v' + port.version : '';
  el.appendChild(ver);

  el.onclick = () => openDetails(port);
  return el;
}

// ===== Modal Logic =====
function openDetails(port) {
  detailIcon.src = port.icon || '';
  detailTitle.textContent = port.name || '';
  detailAuthor.textContent = port.author || '';
  detailVersion.textContent = port.version ? 'v' + port.version : '';
  detailDesc.textContent = port.description || '';
  detailTitle.style.color = port.color || '#000';
  downloadBtn.style.background = port.color || '#555';

  sourceBtn.onclick = () => port.source && window.open(port.source, '_blank');
  downloadBtn.onclick = () => port.download && window.open(port.download, '_blank');

  // Blur and dim first
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
  detailsBox.classList.remove('show', 'hide');
  detailsBox.style.opacity = '0';
  detailsBox.style.transform = 'scale(.92)';

  // After slight delay, pop in details
  setTimeout(() => {
    detailsBox.classList.add('show');
  }, 180);
}

function hideDetails() {
  detailsBox.classList.remove('show');
  detailsBox.classList.add('hide');
  setTimeout(() => {
    backdrop.classList.remove('show');
    document.body.style.overflow = '';
  }, 350);
}

closeBtn.onclick = hideDetails;
backdrop.onclick = e => { if (e.target === backdrop) hideDetails(); };
document.onkeydown = e => { if (e.key === 'Escape' && backdrop.classList.contains('show')) hideDetails(); };

// ===== Initialize =====
(async function init() {
  const manifest = await fetchJSON('ports.json');
  if (!manifest) {
    grid.innerHTML = '<div style="padding:40px;color:#666">Could not load ports.json</div>';
    return;
  }

  const slugs = Array.isArray(manifest) ? manifest : Object.values(manifest);
  const loaded = [];
  for (const slug of slugs) {
    const data = await fetchJSON('ports/' + slug + '.json');
    if (data) loaded.push(data);
  }

  grid.innerHTML = '';
  loaded.forEach(p => grid.appendChild(makeCard(p)));
  portCount.textContent = `${loaded.length} Port${loaded.length === 1 ? '' : 's'} Available`;
})();
</script>
<div class="bg"></div>
</body>
</html>
