<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nintendo Switch Ports</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --muted:#e9e9e9;
    --card:#efefef;
    --text:#111;
    --radius:38px;
    --card-pad:28px;
    --max-width:1200px;
  }

  html,body{
    height:100%;
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:var(--max-width);
    margin:40px auto;
    padding:20px;
  }

  header{
    text-align:center;
    margin-bottom:36px;
  }
  h1{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:54px; /* smaller title */
    margin:0;
    color:#9a9a9a;
    letter-spacing:1px;
  }

  /* Grid */
  .grid{
    display:flex;
    gap:32px;
    flex-wrap:wrap;
    justify-content:flex-start;
  }
  .card{
    background:var(--card);
    border-radius:40px;
    padding:22px;
    width:240px;
    box-sizing:border-box;
    text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,0.03);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    user-select:none;
  }
  .card:hover{ transform:translateY(-6px); box-shadow:0 12px 30px rgba(0,0,0,0.06); }

  .icon{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:6px;
    display:block;
    margin:6px auto 14px;
    background:#ddd;
  }
  .title{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:6px 0;
  }
  .ver{
    font-weight:700;
    color:#111;
    margin-top:6px;
  }

  /* Details overlay */
  .backdrop{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
  }
  .backdrop.show{ display:flex; }
  .overlay{
    position:relative;
    width:min(1100px,95%);
    border-radius:48px;
    background:var(--card);
    padding:36px;
    box-sizing:border-box;
    box-shadow:0 30px 80px rgba(0,0,0,0.15);
    display:grid;
    grid-template-columns:180px 1fr 180px;
    gap:24px;
    align-items:start;
  }

  .backdrop::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.6);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    z-index:-1;
  }

  .back-left{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }
  .big-icon{ width:140px;height:140px;border-radius:8px;object-fit:cover;background:#ddd; }

  .details-title{
    font-family:'Montserrat',sans-serif;
    font-size:40px;
    margin:0 0 6px 0;
  }
  .details-sub{
    margin:0 0 12px 0;
    font-weight:700;
    color:#111;
  }
  .chips{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .btn{
    padding:18px 28px;
    border-radius:28px;
    background:#cfcfcf;
    font-weight:700;
    cursor:pointer;
    border:none;
    box-shadow:none;
    width:140px;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.download{ font-size:20px; width:160px; }

  .desc{
    grid-column:1 / span 3;
    font-size:30px;
    line-height:1.08;
    text-align:center;
    margin-top:10px;
    font-weight:700;
  }

  .nav-back{
    position:absolute;
    left:20px;
    top:16px;
    width:48px;
    height:48px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.05);
    font-weight:900;
    cursor:pointer;
  }

  @media(max-width:900px){
    h1{ font-size:42px; }
    .overlay{ grid-template-columns:120px 1fr; }
    .desc{ font-size:20px; grid-column:1 / -1; }
  }
  @media(max-width:560px){
    .grid{ justify-content:center; }
    .card{ width:80%; max-width:360px; }
    h1{ font-size:36px; }
    .overlay{ width:96%; padding:18px; border-radius:26px; grid-template-columns:100px 1fr; gap:12px; }
    .desc{ font-size:18px; }
    .details-title{ font-size:28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nintendo Switch Ports</h1>
  </header>

  <main>
    <section class="grid" id="grid"></section>
  </main>
</div>

<!-- Details overlay -->
<div class="backdrop" id="backdrop" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="overlay" role="document">
    <button class="nav-back" id="closeBtn" aria-label="Close details">←</button>

    <div class="back-left">
      <img src="" alt="" class="big-icon" id="detailIcon">
      <div id="detailAuthor"></div>
      <div id="detailVersion"></div>
    </div>

    <div>
      <h2 class="details-title" id="detailTitle">Title</h2>
      <div class="details-sub" id="detailAuthorName">Author</div>
    </div>

    <div class="chips">
      <button class="btn download" id="downloadBtn">Download</button>
      <button class="btn" id="sourceBtn">Source</button>
    </div>

    <div class="desc" id="detailDesc">Description</div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const backdrop = document.getElementById('backdrop');
const closeBtn = document.getElementById('closeBtn');

const detailIcon = document.getElementById('detailIcon');
const detailTitle = document.getElementById('detailTitle');
const detailAuthor = document.getElementById('detailAuthor');
const detailAuthorName = document.getElementById('detailAuthorName');
const detailVersion = document.getElementById('detailVersion');
const detailDesc = document.getElementById('detailDesc');
const downloadBtn = document.getElementById('downloadBtn');
const sourceBtn = document.getElementById('sourceBtn');

let portsList = [];

async function fetchJSON(path){
  try{
    const res = await fetch(path, {cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(e){
    console.warn("Failed to fetch", path, e);
    return null;
  }
}

function makeCard(port){
  const el = document.createElement('button');
  el.className = 'card';
  el.setAttribute('aria-label', port.name + ' — open details');
  el.tabIndex = 0;

  const img = document.createElement('img');
  img.className = 'icon';
  img.src = port.icon || '';
  img.alt = port.name + ' icon';
  el.appendChild(img);

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = port.name;
  if(port.color) title.style.color = port.color;
  el.appendChild(title);

  const ver = document.createElement('div');
  ver.className = 'ver';
  ver.textContent = port.version ? 'v' + port.version : '';
  el.appendChild(ver);

  el.addEventListener('click',()=>openDetails(port));
  return el;
}

function openDetails(port){
  detailIcon.src = port.icon || '';
  detailTitle.textContent = port.name || '';
  detailAuthor.textContent = port.author || '';
  detailAuthorName.textContent = port.author || '';
  detailVersion.textContent = port.version ? 'v' + port.version : '';
  detailDesc.textContent = port.description || '';
  detailTitle.style.color = port.color || '#000';

  if(port.download){
    downloadBtn.onclick = ()=>window.open(port.download,'_blank');
    downloadBtn.disabled = false;
  }else downloadBtn.disabled = true;

  if(port.source){
    sourceBtn.onclick = ()=>window.open(port.source,'_blank');
    sourceBtn.disabled = false;
  }else sourceBtn.disabled = true;

  showBackdrop();
}

function showBackdrop(){
  backdrop.classList.add('show');
  document.body.style.overflow='hidden';
}
function hideBackdrop(){
  backdrop.classList.remove('show');
  document.body.style.overflow='';
}
closeBtn.addEventListener('click', hideBackdrop);
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) hideBackdrop(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && backdrop.classList.contains('show')) hideBackdrop(); });

(async function init(){
  const manifest = await fetchJSON('ports.json');
  if(!manifest){
    grid.innerHTML='<div style="padding:40px;color:#666">Could not load ports.json</div>';
    return;
  }
  const slugs = Array.isArray(manifest)?manifest:Object.values(manifest);
  const loaded=[];
  for(const slug of slugs){
    const data = await fetchJSON('ports/'+slug+'.json');
    if(data){ data._slug=slug; loaded.push(data); }
  }
  portsList = loaded;
  grid.innerHTML='';
  loaded.forEach(p=>grid.appendChild(makeCard(p)));
})();
</script>
</body>
</html>
